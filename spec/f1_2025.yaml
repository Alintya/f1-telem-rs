version:
  format: 2025
  year: 25
  module: v2025

# Only differences from F1 24 are listed. Entries replace the parent's
# by struct name / packet id / event code; new entries are appended.
extends: f1_2024

structs:
  # F1 25 new: livery colour used by ParticipantData
  - name: LiveryColour
    fields:
      - { name: red, ty: u8 }
      - { name: green, ty: u8 }
      - { name: blue, ty: u8 }

  # F1 25 Participants: name shrinks to 32 bytes, adds numColours + liveryColours
  - name: ParticipantData
    fields:
      - { name: ai_controlled, ty: u8 }
      - { name: driver_id, ty: u8 }
      - { name: network_id, ty: u8 }
      - { name: team_id, ty: u8 }
      - { name: my_team, ty: u8 }
      - { name: race_number, ty: u8 }
      - { name: nationality, ty: u8 }
      - { name: name, ty: "string(32)" }
      - { name: your_telemetry, ty: u8 }
      - { name: show_online_names, ty: u8 }
      - { name: tech_level, ty: u16 }
      - { name: platform, ty: u8 }
      - { name: num_colours, ty: u8 }
      - { name: livery_colours, ty: "[LiveryColour; 4]" }

  # F1 25 FinalClassification: adds result_reason
  - name: FinalClassificationData
    fields:
      - { name: position, ty: u8 }
      - { name: num_laps, ty: u8 }
      - { name: grid_position, ty: u8 }
      - { name: points, ty: u8 }
      - { name: num_pit_stops, ty: u8 }
      - { name: result_status, ty: u8 }
      - { name: result_reason, ty: u8 }
      - { name: best_lap_time_in_ms, ty: u32 }
      - { name: total_race_time, ty: f64 }
      - { name: penalties_time, ty: u8 }
      - { name: num_penalties, ty: u8 }
      - { name: num_tyre_stints, ty: u8 }
      - { name: tyre_stints_actual, ty: "[u8; 8]" }
      - { name: tyre_stints_visual, ty: "[u8; 8]" }
      - { name: tyre_stints_end_laps, ty: "[u8; 8]" }

  # F1 25 LobbyInfo: name shrinks to 32 bytes
  - name: LobbyInfoData
    fields:
      - { name: ai_controlled, ty: u8 }
      - { name: team_id, ty: u8 }
      - { name: nationality, ty: u8 }
      - { name: platform, ty: u8 }
      - { name: name, ty: "string(32)" }
      - { name: car_number, ty: u8 }
      - { name: your_telemetry, ty: u8 }
      - { name: show_online_names, ty: u8 }
      - { name: tech_level, ty: u16 }
      - { name: ready_status, ty: u8 }

  # F1 25 CarDamage: adds tyre_blisters
  - name: CarDamageData
    fields:
      - { name: tyres_wear, ty: "[f32; 4]" }
      - { name: tyres_damage, ty: "[u8; 4]" }
      - { name: brakes_damage, ty: "[u8; 4]" }
      - { name: tyre_blisters, ty: "[u8; 4]" }
      - { name: front_left_wing_damage, ty: u8 }
      - { name: front_right_wing_damage, ty: u8 }
      - { name: rear_wing_damage, ty: u8 }
      - { name: floor_damage, ty: u8 }
      - { name: diffuser_damage, ty: u8 }
      - { name: sidepod_damage, ty: u8 }
      - { name: drs_fault, ty: u8 }
      - { name: ers_fault, ty: u8 }
      - { name: gear_box_damage, ty: u8 }
      - { name: engine_damage, ty: u8 }
      - { name: engine_mguh_wear, ty: u8 }
      - { name: engine_es_wear, ty: u8 }
      - { name: engine_ce_wear, ty: u8 }
      - { name: engine_ice_wear, ty: u8 }
      - { name: engine_mguk_wear, ty: u8 }
      - { name: engine_tc_wear, ty: u8 }
      - { name: engine_blown, ty: u8 }
      - { name: engine_seized, ty: u8 }

packets:
  # 4: Participants — 1284 bytes (name=32, +numColours+liveryColours)
  - name: Participants
    id: 4
    size: 1284
    fields:
      - { name: num_active_cars, ty: u8 }
      - { name: participants, ty: "[ParticipantData; 22]" }

  # 8: FinalClassification — 1042 bytes (+result_reason)
  - name: FinalClassification
    id: 8
    size: 1042
    fields:
      - { name: num_cars, ty: u8 }
      - { name: classification_data, ty: "[FinalClassificationData; 22]" }

  # 9: LobbyInfo — 954 bytes (name=32)
  - name: LobbyInfo
    id: 9
    size: 954
    fields:
      - { name: num_players, ty: u8 }
      - { name: lobby_players, ty: "[LobbyInfoData; 22]" }

  # 10: CarDamage — 1041 bytes (+tyre_blisters)
  - name: CarDamage
    id: 10
    size: 1041
    fields:
      - { name: car_damage_data, ty: "[CarDamageData; 22]" }

  # 13: MotionEx — 273 bytes (+chassisPitch, wheelCamber, wheelCamberGain)
  - name: MotionEx
    id: 13
    size: 273
    fields:
      - { name: suspension_position, ty: "[f32; 4]" }
      - { name: suspension_velocity, ty: "[f32; 4]" }
      - { name: suspension_acceleration, ty: "[f32; 4]" }
      - { name: wheel_speed, ty: "[f32; 4]" }
      - { name: wheel_slip_ratio, ty: "[f32; 4]" }
      - { name: wheel_slip_angle, ty: "[f32; 4]" }
      - { name: wheel_lat_force, ty: "[f32; 4]" }
      - { name: wheel_long_force, ty: "[f32; 4]" }
      - { name: height_of_cog_above_ground, ty: f32 }
      - { name: local_velocity_x, ty: f32 }
      - { name: local_velocity_y, ty: f32 }
      - { name: local_velocity_z, ty: f32 }
      - { name: angular_velocity_x, ty: f32 }
      - { name: angular_velocity_y, ty: f32 }
      - { name: angular_velocity_z, ty: f32 }
      - { name: angular_acceleration_x, ty: f32 }
      - { name: angular_acceleration_y, ty: f32 }
      - { name: angular_acceleration_z, ty: f32 }
      - { name: front_wheels_angle, ty: f32 }
      - { name: wheel_vert_force, ty: "[f32; 4]" }
      - { name: front_aero_height, ty: f32 }
      - { name: rear_aero_height, ty: f32 }
      - { name: front_roll_angle, ty: f32 }
      - { name: rear_roll_angle, ty: f32 }
      - { name: chassis_yaw, ty: f32 }
      - { name: chassis_pitch, ty: f32 }
      - { name: wheel_camber, ty: "[f32; 4]" }
      - { name: wheel_camber_gain, ty: "[f32; 4]" }

  # 15: LapPositions — 1131 bytes (new in F1 25)
  - name: LapPositions
    id: 15
    size: 1131
    fields:
      - { name: num_laps, ty: u8 }
      - { name: lap_start, ty: u8 }
      - { name: position_for_vehicle_idx, ty: "[u8; 1100]" }

events:
  # F1 25: Retirement adds reason
  - name: Retirement
    code: RTMT
    fields:
      - { name: vehicle_idx, ty: u8 }
      - { name: reason, ty: u8 }
  # F1 25: DrsDisabled carries reason
  - name: DrsDisabled
    code: DRSD
    fields:
      - { name: reason, ty: u8 }
  # F1 25: StopGoServed adds stop_time
  - name: StopGoServed
    code: SGSV
    fields:
      - { name: vehicle_idx, ty: u8 }
      - { name: stop_time, ty: f32 }
