[package]
name = "f1-telem"
version = "0.1.0"
edition = "2021"
description = "F1 game UDP telemetry parser supporting F1 23, 24, 25 and the F1 25 2026 Season Pack"
license = "MIT"
repository = "https://github.com/Alintya/f1-telem-rs"

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1"

[package.metadata.docs.rs]
features = ["serde"]

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"


[[bin]]
name = "f1-listen"
path = "src/bin/listen.rs"